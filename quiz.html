<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红帽挑战赛初赛刷题 · RHCSA</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
  --text:#e8eaf0; --muted:#9aa1b0; --red:#cc0000; --red2:#ff4d4d;
  --green:#2ecc71; --yellow:#f1c40f; --blue:#4d8dff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:44px;height:44px;border-radius:10px;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px}
h1{font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:16px;margin-bottom:12px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mode{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.mode:hover{border-color:var(--red2);transform:translateY(-2px)}
.mode b{display:block;font-size:15px;margin-bottom:6px}
.mode span{color:var(--muted);font-size:12.5px;line-height:1.5}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin-bottom:8px}
.tag.single{background:rgba(77,141,255,.15);color:var(--blue)}
.tag.multi{background:rgba(241,196,15,.15);color:var(--yellow)}
.tag.fill{background:rgba(46,204,113,.15);color:var(--green)}
.tag.prac{background:rgba(204,0,0,.2);color:var(--red2)}
.qtext{font-size:15.5px;line-height:1.7;margin:8px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:.15s;font-size:14.5px;line-height:1.6}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:rgba(77,141,255,.08)}
.opt.right{border-color:var(--green);background:rgba(46,204,113,.1)}
.opt.wrong{border-color:var(--red2);background:rgba(255,77,77,.08)}
.opt .key{font-weight:bold;color:var(--blue);min-width:20px}
.opt.right .key{color:var(--green)}
.opt.wrong .key{color:var(--red2)}
.fillrow{display:flex;gap:10px;margin:12px 0}
.fillrow input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:Consolas,monospace}
.fillrow input:focus{border-color:var(--blue)}
.btn{border:none;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer;font-weight:bold;transition:.15s}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red2)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:12px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.explain{background:rgba(77,141,255,.07);border-left:3px solid var(--blue);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.7;color:#c9d4ee;white-space:pre-wrap}
.cmd{font-family:Consolas,monospace;background:#0a0c10;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13.5px;color:#a6e3a1;white-space:pre-wrap;overflow-x:auto}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.progress{flex:1;min-width:200px;height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));width:0;transition:.3s}
.score-pill{background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:6px 16px;font-size:13px}
.result{text-align:center;padding:30px 20px}
.result .big{font-size:52px;font-weight:bold;margin:10px 0}
.pct-bar{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:16px auto;max-width:420px}
.pct-bar i{display:block;height:100%;border-radius:99px}
.hidden{display:none}
code{font-family:Consolas,monospace;background:#0a0c10;padding:1px 6px;border-radius:4px;font-size:13px;color:#a6e3a1}
.wronglist{list-style:none;margin-top:10px}
.wronglist li{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;color:var(--muted);cursor:pointer;line-height:1.6}
.wronglist li:hover{border-color:var(--red2)}
.catline{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">R</div>
    <div>
      <h1>红帽挑战赛初赛刷题</h1>
      <div class="sub">RHCSA 为主 · 少量 RHCE · 单选 / 多选 / 填空 / 实操</div>
    </div>
  </header>
  <div id="home"></div>
  <div id="quiz" class="hidden"></div>
  <div id="result" class="hidden"></div>
</div>

<script>
/* ================== 题库 ==================
  single: 单选  multi: 多选(answer为数组)  fill: 填空(answers为可接受答案数组)
  prac: 实操题, showAnswer 后自判 */
const BANK = [
/* ---------- 单选题（依据讲义 + 网络真题风格） ---------- */
{t:"single",cat:"Linux基础",q:"Linux 系统中，普通用户家目录默认位于哪个目录？",o:["/root","/home","/etc","/usr"],a:1,e:"普通用户家目录在 /home 下，root 用户家目录在 /root。"},
{t:"single",cat:"Linux基础",q:"查看当前所在目录的命令是？",o:["pwd","cd","ls","whoami"],a:0,e:"pwd（print working directory）打印当前目录；ls 列出文件；whoami 显示当前用户。"},
{t:"single",cat:"Linux基础",q:"递归新建多级目录 /data/log 应使用？",o:["mkdir /data/log","mkdir -p /data/log","touch -d /data/log","rmdir /data/log"],a:1,e:"mkdir -p 可递归创建不存在的父目录。"},
{t:"single",cat:"Linux基础",q:"下列哪个命令只能删除空目录？",o:["rm","rm -r","rmdir","mv"],a:2,e:"rmdir 只能删除空目录；删除非空目录用 rm -r。"},
{t:"single",cat:"Linux基础",q:"实时跟踪日志文件新增内容的命令是？",o:["cat -f","head -f","tail -f","less -f"],a:2,e:"tail -f 实时跟踪文件末尾新增内容，看日志必备。"},
{t:"single",cat:"Linux基础",q:"分页查看大文件且支持上下翻页，推荐使用？",o:["cat","less","head","tail"],a:1,e:"less 可上下翻页；cat 一次输出全部，不适合大文件。"},
{t:"single",cat:"Linux基础",q:"复制目录及其内容必须使用的参数是？",o:["-p","-r","-i","-f"],a:1,e:"cp -r 递归复制目录；cp -i 覆盖前提示。"},
{t:"single",cat:"Linux基础",q:"基于数据库快速查找文件，但需先执行什么命令更新数据库？",o:["find","updatedb","which","whereis"],a:1,e:"locate 依赖 mlocate.db 数据库，需 updatedb 更新后才能查到新文件。"},
{t:"single",cat:"Linux基础",q:"查询命令 curl 的可执行文件路径应使用？",o:["which curl","find curl","locate curl","whereis curl"],a:0,e:"which 专门查找命令的可执行文件路径。"},
{t:"single",cat:"Linux基础",q:"将 /etc 目录仅打包不压缩，命令是？",o:["tar -zcvf a.tar.gz /etc","tar -Jcvf a.tar.xz /etc","tar -cvf a.tar /etc","tar -tvf a.tar /etc"],a:2,e:"仅打包用 tar -cvf；-z 是 gzip 压缩，-J 是 xz 压缩，-t 是查看清单。"},
{t:"single",cat:"Linux基础",q:"tar 参数中 -J 表示？",o:["gzip 压缩","xz 压缩","bzip2 压缩","不压缩"],a:1,e:"-z gzip、-J xz、-j bzip2。"},
{t:"single",cat:"Linux基础",q:"关于软链接与硬链接，下列说法正确的是？",o:["硬链接可以跨文件系统","硬链接可以链接目录","软链接删除源文件后失效","软链接与源文件共用 inode"],a:2,e:"硬链接不可跨文件系统、不可链目录；软链接是独立 inode，删源即失效。"},
{t:"single",cat:"用户与组",q:"存放用户加密密码的文件是？",o:["/etc/passwd","/etc/shadow","/etc/group","/etc/gshadow"],a:1,e:"/etc/shadow 存密码密文与有效期；/etc/passwd 存基本信息。"},
{t:"single",cat:"用户与组",q:"普通用户 UID 默认从多少开始？",o:["0","1","100","1000"],a:3,e:"root 为 0，系统用户 1~999，普通用户从 1000 开始。"},
{t:"single",cat:"用户与组",q:"将用户 webuser 追加到 wheel 附属组且保留原有组的命令是？",o:["usermod -g wheel webuser","usermod -aG wheel webuser","useradd -G wheel webuser","groupadd wheel webuser"],a:1,e:"-aG 是追加附属组；-g 是修改主组，会丢失原附属组归属。"},
{t:"single",cat:"用户与组",q:"删除用户及其家目录、邮件文件的命令是？",o:["userdel","userdel -r","userdel -f","rmuser -a"],a:1,e:"userdel -r 连同家目录与邮件一并删除。"},
{t:"single",cat:"用户与组",q:"设置密码最长使用 30 天，应使用？",o:["passwd -M 30 user","chage -M 30 user","chown -M 30 user","usermod -M 30 user"],a:1,e:"chage 管理密码周期：-M 最长使用天数，-l 查看策略。"},
{t:"single",cat:"用户与组",q:"锁定用户账号的命令是？",o:["passwd -l user","passwd -u user","chage -l user","usermod -L user"],a:0,e:"passwd -l 锁定、-u 解锁。"},
{t:"single",cat:"用户与组",q:"能查询 LDAP 域用户的命令是？",o:["cat /etc/passwd","getent passwd user01","id -L user01","who user01"],a:1,e:"getent 除了查本地文件还能查 LDAP 等后端；cat 只能看本地。"},
{t:"single",cat:"文件权限",q:"权限串 rwxr-xr-x 对应的数字是？",o:["755","644","700","777"],a:0,e:"r=4,w=2,x=1：rwx=7，r-x=5，r-x=5。"},
{t:"single",cat:"文件权限",q:"对目录而言，能够进入该目录需要的权限是？",o:["r","w","x","s"],a:2,e:"目录的 x 是进入权限，是读取内部文件的前提；无 x 即使有 r 也进不去。"},
{t:"single",cat:"文件权限",q:"umask 为 022 时，新建文件的默认权限是？",o:["644","666","755","600"],a:0,e:"新建文件 = 666−022 = 644；新建目录 = 777−022 = 755。"},
{t:"single",cat:"文件权限",q:"目录内新建文件自动继承目录属组，应设置什么权限？",o:["SUID","SGID","Sticky","ACL"],a:1,e:"SGID（chmod g+s 目录）使新建文件继承目录属组，用于团队共享目录。"},
{t:"single",cat:"文件权限",q:"/tmp 目录上常见的 Sticky 位（t）的作用是？",o:["执行时临时拥有属主权限","新建文件继承属组","仅文件所有者可删除自己的文件","自动加密文件"],a:2,e:"Sticky 位保证 /tmp 中用户只能删除自己的文件。"},
{t:"single",cat:"文件权限",q:"ls -l 权限位末尾出现 + 表示？",o:["该文件有硬链接","该文件设置了 ACL","该文件是脚本","该文件被锁定"],a:1,e:"setfacl 设置 ACL 后，权限末尾显示 +；getfacl 可查看。"},
{t:"single",cat:"文件权限",q:"为用户 webuser 单独授予文件读写权限，命令是？",o:["chmod u:webuser:rw file","setfacl -m u:webuser:rw file","chown webuser file","setfacl -x u:webuser file"],a:1,e:"setfacl -m 修改 ACL 条目，-x 删除条目。"},
{t:"single",cat:"进程管理",q:"动态查看 CPU / 内存占用应使用？",o:["ps aux","top","pstree","free -m"],a:1,e:"ps 是静态快照，top 动态刷新，pstree 看进程树。"},
{t:"single",cat:"进程管理",q:"哪个信号强制杀死进程且不可被拦截？",o:["15","9","2","1"],a:1,e:"SIGKILL(9) 强制不可拦截；SIGTERM(15) 温和终止推荐先用；SIGINT(2) 等同 Ctrl+C。"},
{t:"single",cat:"进程管理",q:"进程状态 Z 表示？",o:["运行","可中断睡眠","僵尸进程","停止"],a:2,e:"Z 僵尸 = 进程已结束但父进程未回收资源；D 是不可中断睡眠。"},
{t:"single",cat:"进程管理",q:"关于 nice 值，说法正确的是？",o:["值越大优先级越高","范围 -20~19，越小优先级越高","普通用户可设负值","root 用户只能调大 nice"],a:1,e:"nice 越小优先级越高；普通用户只能调大（降优先级），root 可设负值。"},
{t:"single",cat:"磁盘与LVM",q:"RHEL 默认的文件系统是？",o:["ext4","xfs","vfat","btrfs"],a:1,e:"RHEL 7/8/9 默认 xfs，格式化命令 mkfs.xfs。"},
{t:"single",cat:"磁盘与LVM",q:"查看已挂载文件系统的空间占用应使用？",o:["du -sh","df -h","lsblk","fdisk -l"],a:1,e:"df 看文件系统占用，du 看目录占用，lsblk 看块设备。"},
{t:"single",cat:"磁盘与LVM",q:"df 显示的空间比 du 大，最常见原因是？",o:["统计误差","已删除文件仍被进程占用未释放","文件系统损坏","包含 swap"],a:1,e:"文件被删但进程仍持有句柄，空间未释放，lsof 可找到占用进程。"},
{t:"single",cat:"磁盘与LVM",q:"适用于 GPT 分区的工具是？",o:["fdisk","gdisk","mkfs","mount"],a:1,e:"fdisk 用于 MBR，gdisk 用于 GPT，parted 两者都支持。"},
{t:"single",cat:"磁盘与LVM",q:"永久挂载需要写入哪个文件？",o:["/etc/mtab","/etc/fstab","/proc/mounts","/etc/mount.conf"],a:1,e:"写入 /etc/fstab 才能开机自动挂载，推荐用 UUID 标识设备；改完用 mount -a 验证。"},
{t:"single",cat:"磁盘与LVM",q:"xfs 文件系统扩容（LV 扩容后）应执行？",o:["resize2fs","xfs_growfs","mkfs.xfs","fsck.xfs"],a:1,e:"xfs 用 xfs_growfs，ext4 用 resize2fs；扩完 LV 必须扩文件系统才识别新容量。"},
{t:"single",cat:"磁盘与LVM",q:"LVM 创建的正确流程是？",o:["lvcreate→vgcreate→pvcreate","pvcreate→vgcreate→lvcreate","vgcreate→pvcreate→lvcreate","pvcreate→lvcreate→vgcreate"],a:1,e:"物理卷 PV → 卷组 VG → 逻辑卷 LV。"},
{t:"single",cat:"磁盘与LVM",q:"RAID5 至少需要几块硬盘？",o:["2","3","4","5"],a:1,e:"RAID5 分布式奇偶校验，至少 3 块，允许 1 块损坏；RAID1 是镜像，利用率 50%。"},
{t:"single",cat:"磁盘与LVM",q:"关于 RAID0 的说法正确的是？",o:["允许 1 块盘损坏","镜像冗余","条带化，性能最高但无冗余","利用率 50%"],a:2,e:"RAID0 无冗余，单盘损坏数据全部丢失。"},
{t:"single",cat:"磁盘与LVM",q:"修复 xfs 文件系统的命令是？",o:["fsck.ext4","xfs_repair","tune2fs","e2fsck"],a:1,e:"xfs_repair 修复 xfs（建议先卸载）；已挂载文件系统不要在线 fsck。"},
{t:"single",cat:"软件包",q:"dnf/yum 相比 rpm 安装的最大优势是？",o:["速度更快","自动解决依赖关系","支持更多格式","不需要 root"],a:1,e:"dnf/yum 自动解析依赖；rpm 直接安装遇到依赖要手动处理。"},
{t:"single",cat:"软件包",q:"rpm 卸载软件包的参数是？",o:["-i","-q","-e","-V"],a:2,e:"-i 装、-q 查、-e 卸、-qa 查全部、-V 校验。"},
{t:"single",cat:"网络",q:"查看端口监听状态及对应进程的命令是？",o:["ip a","ss -tulnp","ping","nmcli"],a:1,e:"ss -tulnp 看 TCP/UDP 监听端口与进程；ip a 看 IP 地址。"},
{t:"single",cat:"网络",q:"ping IP 通但 ping 域名不通，最可能的问题是？",o:["网络断开","DNS 解析故障","防火墙拦截","网卡故障"],a:1,e:"IP 通说明网络正常，域名不通指向 DNS 问题，可用 nslookup/dig 排查。"},
{t:"single",cat:"网络",q:"NetworkManager 的配置管理工具是？",o:["netstat","nmcli","ss","ifup"],a:1,e:"nmcli / nmtui 是 NetworkManager 的管理工具，配置可持久生效。"},
{t:"single",cat:"网络",q:"定位网络丢包节点应使用？",o:["tcpdump","mtr","ss","dig"],a:1,e:"mtr 定位丢包节点；tcpdump 抓包；dig/nslookup 查 DNS。"},
{t:"single",cat:"Shell",q:"追加写入文件的符号是？",o:[">","<<",">>","2>"],a:2,e:"> 覆盖，>> 追加，2> 重定向错误，&> 合并输出与错误。"},
{t:"single",cat:"Shell",q:"cmd >> all.log 2>&1 的含义是？",o:["输出覆盖写入，错误丢弃","输出追加写入，错误并入该文件","错误单独写文件","仅记录错误"],a:1,e:"2>&1 把错误并入当前标准输出的位置（即追加到 all.log）。"},
{t:"single",cat:"Shell",q:"下列哪个符号表示『前面命令成功才执行后面』？",o:[";","&&","&","|"],a:1,e:"&& 短路执行；; 顺序执行；| 管道；& 后台运行。"},
{t:"single",cat:"Shell",q:"同时把输出写到屏幕和文件的命令是？",o:["tee","cat","echo","redirect"],a:0,e:"command | tee out.log 双写文件与屏幕。"},
{t:"single",cat:"systemd",q:"设置服务开机自启的命令是？",o:["systemctl start nginx","systemctl enable nginx","systemctl restart nginx","systemctl status nginx"],a:1,e:"enable 是开机自启，start 只是立即启动，两者不同。"},
{t:"single",cat:"systemd",q:"查看某服务的 systemd 日志应使用？",o:["dmesg -u nginx","journalctl -u nginx","tail /var/log/nginx","systemctl log nginx"],a:1,e:"journalctl -u 服务名 查服务日志；dmesg 看内核/硬件日志。"},
{t:"single",cat:"systemd",q:"运行级别 3 对应的 target 是？",o:["graphical.target","rescue.target","multi-user.target","reboot.target"],a:2,e:"3↔multi-user（命令行多用户）、5↔graphical（图形）、1↔rescue。"},
{t:"single",cat:"systemd",q:"排查开机慢，分析各单元启动耗时应使用？",o:["systemctl blame","systemd-analyze blame","journalctl blame","top -b"],a:1,e:"systemd-analyze blame 列出各单元启动耗时。"},

{t:"single",cat:"SELinux",q:"SELinux 属于什么类型的访问控制？",o:["自主访问控制 DAC","强制访问控制 MAC","基于角色 RBAC","基于属性 ABAC"],a:1,e:"SELinux 是内核中的 MAC 子系统，在 rwx 的 DAC 之外再加一层校验，root 也要遵守。"},

/* ================== 状态与渲染 ================== */
const TYPE_NAME={single:"单选题",multi:"多选题",fill:"填空题",prac:"实操题"};
let state={list:[],idx:0,score:0,answered:false,mode:"",wrong:[],startTs:0,timerId:null};

const $=id=>document.getElementById(id);
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function home(){
  const counts={};BANK.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  const hist=loadHist();
  $("home").classList.remove("hidden");$("quiz").classList.add("hidden");$("result").classList.add("hidden");
  const w=loadWrong();
  $("home").innerHTML=`
  <div class="card">
    <h2>开始刷题</h2>
    <div class="modes">
      <div class="mode" onclick="start('all')"><b>随机综合</b><span>全部 ${BANK.length} 题随机抽 20 题，模拟初赛</span></div>
      <div class="mode" onclick="start('single')"><b>单选题（${counts.single||0}）</b><span>知识点判断，逐题解析</span></div>
      <div class="mode" onclick="start('multi')"><b>多选题（${counts.multi||0}）</b><span>选错/漏选均不得分</span></div>
      <div class="mode" onclick="start('fill')"><b>填空题（${counts.fill||0}）</b><span>输入命令与参数，精确匹配</span></div>
      <div class="mode" onclick="start('prac')"><b>实操题（${counts.prac||0}）</b><span>先自己想，再对参考命令</span></div>
      <div class="mode" onclick="start('wrong')"><b>错题重练（${w.length}）</b><span>重新做之前做错的题</span></div>
    </div>
  </div>
  <div class="card">
    <h2>考前速记</h2>
    <div style="font-size:13.5px;line-height:2;color:var(--muted)">
      · 目录 x 是进入权限，无 x 有 r 也读不了内部文件<br>
      · <code>usermod -aG</code> 追加附属组；<code>-g</code> 是改主组<br>
      · 新文件 = 666−umask，新目录 = 777−umask<br>
      · SUID 冒属主 · SGID 继承属组 · Sticky 仅所有者可删<br>
      · RHEL 默认 xfs：扩容 <code>xfs_growfs 挂载点</code>，ext4 用 <code>resize2fs 设备</code><br>
      · LVM 流程：pvcreate → vgcreate → lvcreate<br>
      · kill 15 温和 / 9 强制不可挡 / 2 等同 Ctrl+C<br>
      · <code>systemctl enable</code> 是自启，<code>start</code> 只是启动<br>
      · setenforce 0 仅临时，永久要改 /etc/selinux/config<br>
      · IP 通域名不通 = DNS 问题；丢包 mtr、抓包 tcpdump
    </div>
  </div>
  ${hist.length?`<div class="card">
    <h2>刷题记录</h2>
    <table style="width:100%;border-collapse:collapse;font-size:13.5px">
      <tr style="color:var(--muted);text-align:left"><th style="padding:6px 8px">模式</th><th style="padding:6px 8px">成绩</th><th style="padding:6px 8px">正确率</th><th style="padding:6px 8px">用时</th><th style="padding:6px 8px">时间</th></tr>
      ${hist.slice(0,10).map(h=>`<tr style="border-top:1px solid var(--border)"><td style="padding:8px">${h.mode}</td><td style="padding:8px">${h.score}/${h.total}</td><td style="padding:8px;color:${h.pct>=70?"var(--green)":"var(--yellow)"}">${h.pct}%</td><td style="padding:8px">${fmt(h.secs)}</td><td style="padding:8px;color:var(--muted)">${h.time}</td></tr>`).join("")}
    </table>
    <div style="margin-top:12px;text-align:right"><button class="btn ghost" onclick="clearData()">清空记录</button></div>
  </div>`:""}`;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(mode){
  let list;
  if(mode==="all")list=shuffle([...BANK]).slice(0,20);
  else if(mode==="wrong"){list=loadWrong();if(!list.length){alert("暂无错题记录");return}}
  else list=BANK.filter(q=>q.t===mode);
  if(mode!=="all"&&mode!=="wrong")list=shuffle([...list]);
  state={list,idx:0,score:0,answered:false,mode,wrong:[],startTs:Date.now(),timerId:null};
  state.timerId=setInterval(tickTimer,1000);
  $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
  render();
}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+":"+String(ss).padStart(2,"0")}
function tickTimer(){const el=document.getElementById("timer");if(el)el.textContent="⏱ "+fmt(Math.floor((Date.now()-state.startTs)/1000))}
function elapsed(){clearInterval(state.timerId);return Math.floor((Date.now()-state.startTs)/1000)}

let sel=[];
function render(){
  const q=state.list[state.idx];state.answered=false;sel=[];
  const pct=Math.round(state.idx/state.list.length*100);
  $("quiz").innerHTML=`
  <div class="topbar">
    <span class="score-pill">第 ${state.idx+1} / ${state.list.length} 题 · 得分 ${state.score}</span>
    <span class="score-pill" id="timer">⏱ 0:00</span>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <button class="btn ghost" onclick="quit()">退出</button>
  </div>
  <div class="card">
    <span class="tag ${q.t}">${TYPE_NAME[q.t]}</span>
    <span class="catline">${q.cat}${(q.t==="single"||q.t==="multi")?" · 键盘 A/B/C/D 选择，Enter 提交":""}</span>
    <div class="qtext">${esc(q.q)}</div>
    ${q.t==="single"||q.t==="multi"
      ?q.o.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pick(${i})"><span class="key">${"ABCD"[i]}</span><span>${esc(o)}</span></div>`).join("")
      :q.t==="fill"
      ?`<div class="fillrow"><input id="fillin" placeholder="输入答案，回车提交" autocomplete="off" onkeydown="if(event.key==='Enter')submitFill()"></div>`
      :`<div style="color:var(--muted);font-size:13.5px;margin-bottom:14px">先在心里（或虚拟机上）写出完整命令，再点击下方按钮核对参考答案。</div>`}
    <div class="btnrow">
      <span></span>
      ${q.t==="prac"?`<button class="btn primary" id="revealBtn" onclick="reveal()">查看参考命令</button>`
        :q.t==="fill"?`<button class="btn primary" onclick="submitFill()">提交</button>`
        :`<button class="btn primary" id="checkBtn" onclick="check()">提交</button>`}
    </div>
    <div id="feedback"></div>
  </div>`;
  if(q.t==="fill")setTimeout(()=>$("fillin")&&$("fillin").focus(),50);
}

function pick(i){
  if(state.answered)return;
  const q=state.list[state.idx];
  if(q.t==="single"){sel=[i];q.o.forEach((_,j)=>$("opt"+j).classList.toggle("sel",j===i));$("checkBtn").disabled=false;}
  else{const k=sel.indexOf(i);if(k>=0)sel.splice(k,1);else sel.push(i);sel.sort();$("opt"+i).classList.toggle("sel",k<0);}
}

function check(){
  if(state.answered)return;
  const q=state.list[state.idx];state.answered=true;
  let ok;
  if(q.t==="single")ok=sel.length===1&&sel[0]===q.a;
  else ok=sel.length===q.a.length&&sel.every(i=>q.a.includes(i));
  q.o.forEach((_,j)=>{
    const el=$("opt"+j);el.classList.remove("sel");
    if(q.t==="single"){if(j===q.a)el.classList.add("right");else if(j===sel[0])el.classList.add("wrong");}
    else{if(q.a.includes(j))el.classList.add("right");else if(sel.includes(j))el.classList.add("wrong");}
  });
  finish(ok,q);
}

function submitFill(){
  if(state.answered)return;
  const q=state.list[state.idx];
  const v=$("fillin").value.trim().replace(/\s+/g," ");
  if(!v)return;
  state.answered=true;
  const ok=q.a.some(a=>a.toLowerCase()===v.toLowerCase());
  const inp=$("fillin");
  inp.style.borderColor=ok?"var(--green)":"var(--red2)";
  inp.style.opacity=.7;
  finish(ok,q);
}

function reveal(){
  const q=state.list[state.idx];
  $("revealBtn").disabled=true;
  // 实操题自判
  $("feedback").innerHTML=`
    <div class="cmd">${esc(q.c)}</div>
    <div class="explain">${esc(q.e)}</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="selfJudge(0)">我还没掌握</button>
      <button class="btn primary" onclick="selfJudge(1)">我掌握了</button>
    </div>`;
}

function selfJudge(ok){
  if(state.answered)return;
  state.answered=true;
  if(ok)state.score++;else state.wrong.push(state.idx);
  advance();
}

function finish(ok,q){
  if(ok)state.score++;else state.wrong.push(state.idx);
  $("feedback").innerHTML=`<div class="explain">${ok?"✅ 回答正确":"❌ 回答错误"}${q.e?"\n\n"+esc(q.e):""}</div>
  <div class="btnrow"><span></span>
    ${state.idx+1>=state.list.length
      ?`<button class="btn primary" id="nextBtn" onclick="advance()">查看成绩</button>`
      :`<button class="btn primary" id="nextBtn" onclick="advance()">下一题 →</button>`}
  </div>`;
  $("nextBtn").focus();
}
function advance(){
  state.idx++;
  if(state.idx>=state.list.length)showResult();else render();
}

function showResult(){
  const total=state.list.length,pct=Math.round(state.score/total*100);
  const secs=elapsed();
  let grade,col;
  if(pct>=90){grade="优秀，初赛稳了！";col="var(--green)"}
  else if(pct>=70){grade="良好，再刷几轮错题";col="var(--blue)"}
  else if(pct>=50){grade="及格边缘，重点补弱项";col="var(--yellow)"}
  else{grade="还得多刷，回讲义补基础";col="var(--red2)"}
  // 记录历史
  const hist=loadHist();
  const key=state.mode==="all"?"all":state.mode;
  hist.unshift({mode:TYPE_NAME[key]||"随机综合",score:state.score,total,pct,secs,time:new Date().toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})});
  saveHist(hist.slice(0,20));
  // 存错题
  const wrongQs=state.wrong.map(i=>state.list[i]);
  if(state.mode!=="wrong"){const w=loadWrong();wrongQs.forEach(q=>{if(!w.some(x=>x.q===q.q))w.push(q)});saveWrong(w)}
  else{const w=loadWrong();const keep=w.filter(x=>!wrongQs.some(y=>y.q===x.q));saveWrong(keep)}
  const wrongHtml=state.wrong.length?`<ul class="wronglist">${state.wrong.map(i=>{const q=state.list[i];return `<li onclick="retryWrong()">${TYPE_NAME[q.t]} · ${esc(q.q).slice(0,60)}…</li>`}).join("")}</ul>`:"<p style='color:var(--muted)'>本次全对，没有错题 🎉</p>";
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("result").innerHTML=`
  <div class="card result">
    <h2>练习结束</h2>
    <div class="big" style="color:${col}">${state.score} / ${total}</div>
    <div class="pct-bar"><i style="width:${pct}%;background:${col}"></i></div>
    <p style="color:var(--muted)">${grade}（正确率 ${pct}% · 用时 ${fmt(secs)}）</p>
    <div style="margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="btn primary" onclick="start('${state.mode}')">再来一轮</button>
      <button class="btn ghost" onclick="home()">返回首页</button>
    </div>
  </div>
  <div class="card">
    <h2>本次错题（点击重练全部错题）</h2>
    ${wrongHtml}
  </div>`;
}

function retryWrong(){start("wrong")}
function quit(){clearInterval(state.timerId);if(confirm("确定退出本次练习？当前进度不保存。"))home()}
/* 键盘快捷键 */
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden"))return;
  if(state.answered){
    if(e.key==="Enter"){e.preventDefault();const b=document.querySelector(".btnrow .btn.primary:last-of-type, #nextBtn");if(b)b.click();}
    return;
  }
  const q=state.list[state.idx];if(!q)return;
  if(q.t==="single"||q.t==="multi"){
    const k=e.key.toUpperCase();
    const i="ABCD".indexOf(k);
    if(i>=0&&i<q.o.length){pick(i);e.preventDefault()}
    else if(e.key==="Enter"&&q.t==="single"&&sel.length)check();
    else if(e.key==="Enter"&&q.t==="multi"&&sel.length)check();
  }else if(q.t==="fill"&&e.key==="Enter"){submitFill()}
});

/* 错题本（localStorage） */
function loadWrong(){try{return JSON.parse(localStorage.getItem("rhcsa_wrong")||"[]")}catch(e){return[]}}
function saveWrong(w){try{localStorage.setItem("rhcsa_wrong",JSON.stringify(w))}catch(e){}}
/* 历史成绩 */
function loadHist(){try{return JSON.parse(localStorage.getItem("rhcsa_hist")||"[]")}catch(e){return[]}}
function saveHist(h){try{localStorage.setItem("rhcsa_hist",JSON.stringify(h))}catch(e){}}
function clearData(){if(confirm("清空错题本和刷题记录？")){localStorage.removeItem("rhcsa_wrong");localStorage.removeItem("rhcsa_hist");home()}}

home();
</script>
</body>
</html>
